<!DOCTYPE html>
<html>
<head>
	<title>
		Spell Checker
	</title>
</head>

<body>
	<h1>Spell Checker</h1>
	<script type="text/javascript" src="scripts/spellchecker.js"></script>
	<div>
		<input id="word" type="text">
		<button onclick="listWordAlignArray('result-list',
			sc.spellCheck(getElementById('word').value, 10));">
			Spell Check!
		</button>
	</div>
	<div name="result-container">
		<label for="result-list">Top 10 Matches:</label>
		<ol id="result-list">
		</ol>
	</div>
</body>
</html>
